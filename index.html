<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trim Depot Menu</title>
<style>
  :root {
    --bg: #0e1110; --card: #171b19; --line: #262c29; --text: #eef2ef; --muted: #8c9a93;
    --accent: #5fd08a; --accent-ink: #0b1f13; --new: #f2c14e; --offer: #9fb6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 22px 0 10px; }
  .brand { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { margin: 4px 0 2px; font-size: 26px; }
  .sub { color: var(--muted); font-size: 13px; }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 0 rgba(95,208,138,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(95,208,138,0); } 100% { box-shadow: 0 0 0 0 rgba(95,208,138,0); } }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .facilities { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .facility { border: 0; background: none; color: var(--muted); border-radius: 9px; padding: 10px 6px; cursor: pointer;
    font-size: 17px; font-weight: 700; line-height: 1.2; }
  .facility small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  .facility.active { background: var(--text); color: var(--bg); }
  .soon { padding: 14px; color: var(--muted); }
  .banner { margin-top: 18px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: #b3c0b9; font-size: 14px; }
  .banner + section { padding-top: 14px; }
  .sdate { color: var(--offer); white-space: nowrap; }
  .tbd { color: var(--muted); font-weight: 500; font-size: 14px; }
  .pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: 1 0 auto; text-align: center; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 9px 10px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .pill b { color: var(--muted); font-weight: 600; margin-left: 5px; }
  .pill.drop { border-color: var(--new); color: var(--new); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill.active b { color: var(--accent-ink); opacity: .7; }
  .pill.drop.active { background: var(--new); border-color: var(--new); color: #241a00; }
  .pill.drop.active b { color: #241a00; }
  input[type=search] { width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; }
  section { padding-top: 22px; }
  h2 { font-size: 18px; margin: 0 0 2px; display: flex; align-items: baseline; gap: 8px; }
  h2 .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: var(--new); color: #241a00;
    padding: 2px 7px; border-radius: 5px; font-weight: 700; }
  .note { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .strain { font-weight: 600; font-size: 16px; }
  .meta { color: #b3c0b9; font-size: 15px; }
  .meta .vid { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
  .price { text-align: right; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .price small { font-weight: 500; color: var(--muted); font-size: 12px; }
  .price.offer { color: var(--offer); font-size: 14px; font-weight: 600; }
  .lbs { text-align: right; color: var(--new); font-size: 16px; font-weight: 700; white-space: nowrap; }
  .empty { padding: 14px; color: var(--muted); }
  .sorts { display: flex; gap: 8px; margin-top: 8px; }
  .sort { flex: 1; padding: 9px 4px; white-space: nowrap; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font-size: 13.5px; cursor: pointer; }
  .sort.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .drophead { padding-top: 22px; }
  .drophead + section { padding-top: 12px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.open { display: flex; }
  .modal .box { width: 100%; max-width: 720px; }
  .modal .frame { position: relative; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; }
  .modal iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modal .close { display: block; margin: 0 0 10px auto; background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .modal .cap { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .gate { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; max-width: 340px; margin: 0 auto; }
  .gate h1 { margin-bottom: 6px; }
  .gate p { color: var(--muted); margin: 0 0 16px; }
  .gate input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 17px; letter-spacing: .04em; }
  .gate button { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-ink); font-size: 16px; font-weight: 700; cursor: pointer; }
  .gate .err { color: #ff8a80; font-size: 14px; min-height: 20px; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form class="wrap gate" id="gate" hidden>
  <div class="brand">Trim Depot</div>
  <h1>Live Menu</h1>
  <p>Enter your customer code to see what's available.</p>
  <input id="code" type="password" autocomplete="current-password" placeholder="Customer code" autofocus>
  <button type="submit" id="unlock">View menu</button>
  <div class="err" id="err"></div>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <div class="brand">Trim Depot</div>
    <h1>Live Menu</h1>
    <div class="sub"><span class="live"></span><span id="where">In the Santa Ana showroom now</span> · <span id="updated"></span></div>
  </header>
  <nav>
    <div class="facilities" id="facilities"></div>
    <div class="pills" id="pills"></div>
    <input type="search" id="q" placeholder="Search strain or Farm #" autocomplete="off">
    <div class="sorts"><button type="button" class="sort active" data-sort="price">Sort by price</button><button type="button" class="sort" data-sort="weight">Sort by weight</button><button type="button" class="sort" data-sort="date" hidden>Sort by date</button></div>
  </nav>
  <main id="menu"></main>
  <footer>Prices are per pound. Inventory and prices update live and are subject to prior sale.</footer>
</div>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" id="close">Close ✕</button>
    <div class="frame"><iframe id="player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
    <div class="cap" id="cap"></div>
  </div>
</div>

  smalls: { title: 'Smalls' },
  off_shelf: { title: 'Off Shelf' },
  norcal_warehouse: { title: 'In warehouse' },
  norcal_shopping: { title: 'Shopping' }
};
// Two facilities, each with its own buttons (Ryan, 10/5). Santa Ana = the showroom, from the Sales Menu.
// NorCal = northern inventory from the Flower tab (norcal.rb): In warehouse (Intake) and Shopping (farm offers).
const FACILITIES = [
  { id: 'santa-ana', label: 'Santa Ana', tag: 'Showroom', where: 'In the Santa Ana showroom now' },
  { id: 'norcal', label: 'NorCal', tag: 'Inventory', where: 'Northern California' }
];
// The buttons under the facility switch. Each shows ONLY its own sections; Off Shelf lives under Flower.
// Opens on Santa Ana's New Drop whenever the sheet has one (first tab with items). Santa Ana tabs hide when
// empty; NorCal tabs always show. NorCal tabs split into Flower and Smalls like New Drop (Ryan, 10/5).
const TABS = [
  { id: 'new-drop', facility: 'santa-ana', sections: ['new_drop'] },
  { id: 'flower', facility: 'santa-ana', label: 'Flower', sections: ['flower', 'off_shelf'] },
  { id: 'smalls', facility: 'santa-ana', label: 'Smalls', sections: ['smalls'] },
  { id: 'norcal-warehouse', facility: 'norcal', label: 'In warehouse', sections: ['norcal_warehouse'], always: true, split: true },
  { id: 'norcal-shopping', facility: 'norcal', label: 'Shopping', sections: ['norcal_shopping'], always: true, split: true,
    note: "Still at the farm, on our schedule to go out there. Pounds are the farm's estimate." }
];
let TAB = location.hash.slice(1);
let DATA = null;
let CODE = null; // the customer code, once it has opened the menu
const CODE_KEY = 'td-menu-code';

// ---- Unlocking: the menu data arrives encrypted with the customer code (see build.rb).
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(locked, code) {
  const s = crypto.subtle;
  const base = await s.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await s.deriveBits(
    { name: 'PBKDF2', salt: b64(locked.salt), iterations: locked.iterations, hash: 'SHA-256' }, base, 512));
  const iv = b64(locked.iv), ct = b64(locked.ct);
  const macKey = await s.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await s.verify('HMAC', macKey, b64(locked.mac), signed)) throw new Error('wrong code');
  const aesKey = await s.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await s.decrypt({ name: 'AES-CBC', iv }, aesKey, ct)));
}
const saveCode = c => { try { localStorage.setItem(CODE_KEY, c); } catch (e) {} };
const savedCode = () => { try { return localStorage.getItem(CODE_KEY); } catch (e) { return null; } };
const forgetCode = () => { try { localStorage.removeItem(CODE_KEY); } catch (e) {} };

function showGate(msg) {
  document.getElementById('app').hidden = true;
  document.getElementById('gate').hidden = false;
  document.getElementById('err').textContent = msg || '';
  document.getElementById('code').focus();
}

async function open(locked, code) {
  try { DATA = await decrypt(locked, code); } catch (e) { return false; }
  CODE = code;
  saveCode(code);
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  render();
  return true;
}

document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim().toUpperCase(); // not case-sensitive (build.rb)
  if (!code) return;
  const btn = document.getElementById('unlock');
  btn.disabled = true; btn.textContent = 'Checking…';
  const ok = await open(window.MENU_LOCKED.locked, code);
  btn.disabled = false; btn.textContent = 'View menu';
  if (!ok) showGate("That code didn't work. Check with your Trim Depot rep.");
});

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const lbs = n => (Number.isInteger(n) ? n : n.toFixed(2).replace(/0+$/, '')) + ' lb' + (n === 1 ? '' : 's');
const title = key => key === 'new_drop' ? (DATA.new_drop_title || 'New Drop') : SECTIONS[key].title;
const tabLabel = t => t.label || "New Drop"; // the date shows in the New Drop heading

const shortDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

function priceHtml(p) {
  if (p == null) return '<div class="price offer">Make offer</div>';
  if (Array.isArray(p)) return `<div class="price">${money(p[0])}–${money(p[1])}<small>/lb</small></div>`;
  return `<div class="price">${money(p)}<small>/lb</small></div>`;
}

// Grade from the strain name (same rule as the farm price page): "smalls" or "micros" = smalls.
const isSmalls = i => /small|micro/i.test(i.strain);
let SORT = 'price'; // 'price' = low to high (default), 'weight' = most pounds first, 'date' = soonest shopping date (Shopping only)
const priceOf = i => i.price == null ? Infinity : Array.isArray(i.price) ? i.price[0] : i.price; // Make offer last
const sorters = {
  price: (a, b) => priceOf(a) - priceOf(b) || (b.lbs || 0) - (a.lbs || 0),
  weight: (a, b) => (b.lbs || 0) - (a.lbs || 0) || priceOf(a) - priceOf(b),
  date: (a, b) => (a.shopping_date || '9999').localeCompare(b.shopping_date || '9999') || priceOf(a) - priceOf(b)
};

// The blocks a tab shows. New Drop and the NorCal tabs are one list each, split into Flower and Smalls.
function blocks(tab) {
  if (tab.id === 'new-drop' || tab.split) {
    const all = DATA.sections[tab.sections[0]] || [];
    return [{ title: 'Flower', items: all.filter(i => !isSmalls(i)) },
            { title: 'Smalls', items: all.filter(isSmalls) }];
  }
  return tab.sections.map(k => ({ title: title(k), items: DATA.sections[k] || [] }));
}

function render() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const match = i => !q || i.strain.toLowerCase().includes(q) || i.farm.includes(q) || (i.type || '').toLowerCase().includes(q);
  document.getElementById('updated').textContent = 'Updated ' + new Date(DATA.generated_at)
    .toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  const hasItems = t => t.sections.some(k => (DATA.sections[k] || []).length);
  const shown = TABS.filter(t => t.always || hasItems(t));
  if (!shown.some(t => t.id === TAB)) TAB = (shown.find(hasItems) || shown[0] || {}).id || '';
  const facility = (shown.find(t => t.id === TAB) || {}).facility || 'santa-ana';
  document.getElementById('facilities').innerHTML = FACILITIES.map(f =>
    `<button type="button" class="facility${f.id === facility ? ' active' : ''}" data-facility="${f.id}">${esc(f.label)}<small>${esc(f.tag)}</small></button>`).join('');
  document.getElementById('where').textContent = FACILITIES.find(f => f.id === facility).where;
  const tabs = shown.filter(t => t.facility === facility);
  const count = t => t.sections.reduce((n, k) => n + (DATA.sections[k] || []).filter(match).length, 0);
  document.getElementById('pills').innerHTML = tabs
    .map(t => `<a class="pill${t.id === 'new-drop' ? ' drop' : ''}${t.id === TAB ? ' active' : ''}" href="#${t.id}" data-tab="${t.id}">${esc(tabLabel(t))}<b>${count(t)}</b></a>`)
    .join('');

  const tab = tabs.find(t => t.id === TAB);
  // Sort by date only exists on Shopping (Ryan, 10/5); elsewhere it falls back to price.
  const dated = !!tab && tab.id === 'norcal-shopping';
  const sort = SORT === 'date' && !dated ? 'price' : SORT;
  document.querySelector('.sort[data-sort=date]').hidden = !dated;
  document.querySelectorAll('.sort').forEach(b => b.classList.toggle('active', b.dataset.sort === sort));
  if (!tab) { document.getElementById('menu').innerHTML = ''; return; }
  const head = tab.id === 'new-drop'
    ? `<div class="drophead"><h2>${esc(title('new_drop'))}<span class="tag">Today</span></h2><div class="note">Arriving today.</div></div>`
    : tab.note ? `<div class="banner">${esc(tab.note)}</div>` : '';
  document.getElementById('menu').innerHTML = head + blocks(tab).map(blk => {
    if (!blk.items.length) return tab.always
      ? `<section><h2>${esc(blk.title)}</h2><div class="list"><div class="soon">None right now.</div></div></section>` : '';
    const items = blk.items.filter(match).sort(sorters[sort]);
    const rows = items.map(i => `
      <div class="item">
        <div class="strain">${esc(i.strain)}</div>
        ${priceHtml(i.price)}
        <div class="meta">Farm #${esc(i.farm)}${i.type ? ' · ' + esc(i.type) : ''}${i.building ? ' · ' + esc(i.building) : ''}${i.shopping_date ? ' · <span class="sdate">Shopping ' + esc(shortDate(i.shopping_date)) + '</span>' : ''}${i.video ? ` · <button class="vid" data-v="${esc(i.video)}" data-c="${esc(i.strain)} · Farm #${esc(i.farm)}">▶ Video</button>` : ''}</div>
        <div class="lbs">${i.lbs == null ? '<span class="tbd">lbs TBD</span>' : (i.estimate ? '~' : '') + lbs(i.lbs)}</div>
      </div>`).join('');
    const total = items.reduce((t, i) => t + (i.lbs || 0), 0);
    return `<section>
      <h2>${esc(blk.title)}</h2>
      <div class="note">${items.length} strains · ${Math.round(total).toLocaleString('en-US')} lbs</div>
      <div class="list">${rows || '<div class="empty">No matches.</div>'}</div>
    </section>`;
  }).join('');
}

// Live updates: re-read the data every minute while the page is open.
async function refresh() {
  if (!window.MENU_DATA_URL) return;
  try {
    const r = await fetch(window.MENU_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (window.PAGE_VERSION && d.version && d.version !== window.PAGE_VERSION) return location.reload();
    if (!CODE || d.locked.ct === window.MENU_LOCKED.locked.ct) return;
    window.MENU_LOCKED = d;
    let fresh;
    try { fresh = await decrypt(d.locked, CODE); } catch (e) { forgetCode(); CODE = null; return showGate('The customer code has changed. Enter the new one.'); }
    if (fresh.generated_at !== DATA.generated_at) { DATA = fresh; render(); }
  } catch (e) { /* offline: keep showing what we have */ }
}

document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('.sort').forEach(b => b.addEventListener('click', () => { SORT = b.dataset.sort; render(); }));
document.getElementById('facilities').addEventListener('click', e => {
  const b = e.target.closest('.facility');
  if (!b) return;
  const mine = TABS.filter(t => t.facility === b.dataset.facility);
  const filled = t => t.sections.some(k => (DATA.sections[k] || []).length);
  const t = mine.find(filled) || mine.find(t => t.always); // open on a tab that has something in it
  if (!t) return;
  TAB = t.id;
  history.replaceState(null, '', '#' + TAB);
  render();
  window.scrollTo(0, 0);
});
document.getElementById('pills').addEventListener('click', e => {
  const p = e.target.closest('.pill');
  if (!p) return;
  e.preventDefault();
  TAB = p.dataset.tab;
  history.replaceState(null, '', '#' + TAB);
  render();
  window.scrollTo(0, 0);
});
window.addEventListener('hashchange', () => { TAB = location.hash.slice(1); render(); });
document.getElementById('menu').addEventListener('click', e => {
  const b = e.target.closest('.vid');
  if (!b) return;
  document.getElementById('player').src = b.dataset.v + (b.dataset.v.includes('?') ? '&' : '?') + 'autoplay=true&muted=true';
  document.getElementById('cap').textContent = b.dataset.c;
  document.getElementById('modal').classList.add('open');
});
const closeModal = () => { document.getElementById('modal').classList.remove('open'); document.getElementById('player').src = 'about:blank'; };
document.getElementById('close').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

(async () => {
  const c = savedCode();
  if (!(c && await open(window.MENU_LOCKED.locked, c))) {
    if (c) forgetCode();
    showGate(c ? 'The customer code has changed. Enter the new one.' : '');
  }
  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
